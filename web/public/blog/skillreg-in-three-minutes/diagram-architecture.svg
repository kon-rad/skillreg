<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif"><rect width="1200" height="510" fill="#f1eee6"/><text x="40" y="46" font-size="12" fill="#b3122b" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="2.5">FIG. A · HOW SKILLREG MOVES DATA</text><text x="40" y="84" font-size="24" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">Writers sign records on Arkiv. Readers verify everything on their own machine.</text><rect x="30" y="150" width="320" height="76" fill="none" stroke="#121314" stroke-width="1.5"/><text x="46" y="178" font-size="17" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="bold" font-style="normal" letter-spacing="0">Publisher wallet</text><text x="46" y="198" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">publish: one readonly record</text><text x="46" y="214" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">per version</text><rect x="30" y="250" width="320" height="76" fill="none" stroke="#121314" stroke-width="1.5"/><text x="46" y="278" font-size="17" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="bold" font-style="normal" letter-spacing="0">Raters: scanner, people, AIs</text><text x="46" y="298" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">rate: one record per verdict</text><text x="46" y="314" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">on an exact sha</text><rect x="30" y="350" width="320" height="76" fill="none" stroke="#121314" stroke-width="1.5"/><text x="46" y="378" font-size="17" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="bold" font-style="normal" letter-spacing="0">Anyone (a sponsor)</text><text x="46" y="398" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">extend: keep a listing alive</text><text x="46" y="414" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">even one it does not own</text><rect x="420" y="130" width="330" height="310" fill="#e6f4f7" stroke="#2aa9c9" stroke-width="2"/><text x="440" y="160" font-size="12" fill="#2aa9c9" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="2.5">ARKIV · TIRAMISU</text><rect x="440" y="180" width="290" height="66" fill="#f1eee6" stroke="#2aa9c9" stroke-width="1.5"/><text x="454" y="204" font-size="16" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="bold" font-style="normal" letter-spacing="0">skill record</text><text x="454" y="222" font-size="11.5" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">name@$creator · readonly</text><text x="454" y="238" font-size="11.5" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">files + manifest hash · 90 days</text><rect x="440" y="262" width="290" height="66" fill="#f1eee6" stroke="#2aa9c9" stroke-width="1.5"/><text x="454" y="286" font-size="16" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="bold" font-style="normal" letter-spacing="0">rating record</text><text x="454" y="304" font-size="11.5" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">$creator · sha · verdict</text><text x="454" y="320" font-size="11.5" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">findings by file:line · 180 days</text><rect x="440" y="344" width="290" height="66" fill="#f1eee6" stroke="#2aa9c9" stroke-width="1.5"/><text x="454" y="368" font-size="16" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="bold" font-style="normal" letter-spacing="0">lifetime</text><text x="454" y="386" font-size="11.5" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">permissionlessExtension</text><text x="454" y="402" font-size="11.5" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">anyone may pay to extend</text><line x1="350" y1="188" x2="438" y2="213" stroke="#121314" stroke-width="1.5"/><polygon points="438,213 428.1,214.2 430.2,206.7" fill="#121314"/><line x1="350" y1="288" x2="438" y2="295" stroke="#121314" stroke-width="1.5"/><polygon points="438,295 428.5,298.2 429.1,290.4" fill="#121314"/><line x1="350" y1="388" x2="438" y2="377" stroke="#121314" stroke-width="1.5"/><polygon points="438,377 429.3,382.0 428.4,374.3" fill="#121314"/><rect x="820" y="130" width="360" height="310" fill="none" stroke="#121314" stroke-width="1.5"/><text x="840" y="160" font-size="12" fill="#b3122b" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="2.5">YOUR MACHINE</text><text x="840" y="192" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">1. query records: no wallet,</text><text x="840" y="221" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">   no server</text><text x="840" y="250" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">2. recompute every file hash</text><text x="840" y="279" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">3. count only ratings from raters</text><text x="840" y="308" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">   in your trust file</text><text x="840" y="337" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">4. verdict: PASS · WARN · BLOCK</text><text x="840" y="366" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">5. install atomically and pin in</text><text x="840" y="395" font-size="13" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">   skills.lock.json</text><line x1="750" y1="285" x2="818" y2="285" stroke="#2aa9c9" stroke-width="2"/><polygon points="818,285 808.8,288.9 808.8,281.1" fill="#2aa9c9"/><text x="784" y="275" font-size="12" fill="#2aa9c9" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">reads</text><text x="30" y="486" font-size="15" fill="#3d3b37" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="italic" letter-spacing="0">CLI, web page and agents all run the same verification code. Nothing of ours sits in the middle.</text></svg>
