<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif"><rect width="1200" height="480" fill="#f1eee6"/><text x="40" y="46" font-size="12" fill="#b3122b" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="2.5">FIG. E · WHAT REAL SKILLS ARE MADE OF (ONE WORKING DEVELOPER MACHINE)</text><text x="40" y="84" font-size="24" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">Most of a skill is knowledge, not code. And most skills are clean.</text><path d="M180.0,115.0 A100,100 0 0 1 280.0,216.3 L238.0,215.8 A58,58 0 0 0 180.0,157.0 Z" fill="#2aa9c9"/><path d="M280.0,216.3 A100,100 0 1 1 180.0,115.0 L180.0,157.0 A58,58 0 1 0 238.0,215.8 Z" fill="#121314"/><text x="180" y="223" font-size="28" fill="#121314" text-anchor="middle" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">234</text><text x="180" y="243" font-size="12" fill="#3d3b37" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">skills</text><rect x="330" y="176" width="14" height="14" fill="#121314"/><text x="354" y="188" font-size="15" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">175 (75%) markdown only: facts, rules, decisions</text><rect x="330" y="208" width="14" height="14" fill="#2aa9c9"/><text x="354" y="220" font-size="15" fill="#121314" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">59 (25%) contain any script file</text><text x="330" y="260" font-size="13" fill="#3d3b37" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="italic" letter-spacing="0">Counted 2026-10-18 across four skill folders.</text><text x="40" y="358" font-size="17" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="bold" font-style="normal" letter-spacing="0">Static scanner v1.1, run over 269 readable skills</text><rect x="40.0" y="380" width="956.9" height="40" fill="#1b7f5a" opacity="0.85"/><rect x="996.9" y="380" width="134.9" height="40" fill="#a86b00" opacity="0.85"/><rect x="1131.8" y="380" width="8.2" height="40" fill="#c2185b" opacity="0.85"/><rect x="40" y="440" width="14" height="14" fill="#1b7f5a"/><text x="62" y="452" font-size="14" fill="#1b7f5a" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="bold" font-style="normal" letter-spacing="0">234 clean</text><rect x="240" y="440" width="14" height="14" fill="#a86b00"/><text x="262" y="452" font-size="14" fill="#a86b00" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="bold" font-style="normal" letter-spacing="0">33 warn</text><rect x="420" y="440" width="14" height="14" fill="#c2185b"/><text x="442" y="452" font-size="14" fill="#c2185b" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="bold" font-style="normal" letter-spacing="0">2 malicious (both send a private key)</text></svg>
