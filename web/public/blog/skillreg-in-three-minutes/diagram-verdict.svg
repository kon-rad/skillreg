<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" width="1200" height="528" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif"><rect width="1200" height="528" fill="#f1eee6"/><text x="40" y="46" font-size="12" fill="#b3122b" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="2.5">FIG. B · THE VERDICT RULE, AS THE CLI APPLIES IT</text><text x="40" y="84" font-size="24" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">Only ratings from raters you trust count. The publisher never rates itself.</text><rect x="40" y="120" width="560" height="62" fill="none" stroke="#121314" stroke-width="1.5"/><text x="60" y="158" font-size="18" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">Any trusted rating says malicious?</text><line x1="600" y1="151" x2="680" y2="151" stroke="#121314" stroke-width="1.5"/><polygon points="680,151 670.8,154.9 670.8,147.1" fill="#121314"/><text x="640" y="142" font-size="12" fill="#3d3b37" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">yes</text><rect x="680" y="128" width="120" height="46" fill="#f1eee6" stroke="#c2185b" stroke-width="2"/><text x="740" y="158" font-size="18" fill="#c2185b" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="bold" font-style="normal" letter-spacing="2">BLOCK</text><text x="820" y="158" font-size="15" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">install refused, exit 2</text><line x1="320" y1="182" x2="320" y2="206" stroke="#3d3b37" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="320,206 316.1,196.8 323.9,196.8" fill="#3d3b37"/><text x="330" y="200" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">no</text><rect x="40" y="212" width="560" height="62" fill="none" stroke="#121314" stroke-width="1.5"/><text x="60" y="250" font-size="18" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">Any trusted rating says warn?</text><line x1="600" y1="243" x2="680" y2="243" stroke="#121314" stroke-width="1.5"/><polygon points="680,243 670.8,246.9 670.8,239.1" fill="#121314"/><text x="640" y="234" font-size="12" fill="#3d3b37" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">yes</text><rect x="680" y="220" width="120" height="46" fill="#f1eee6" stroke="#a86b00" stroke-width="2"/><text x="740" y="250" font-size="18" fill="#a86b00" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="bold" font-style="normal" letter-spacing="2">WARN</text><text x="820" y="250" font-size="15" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">install asks first, exit 3</text><line x1="320" y1="274" x2="320" y2="298" stroke="#3d3b37" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="320,298 316.1,288.8 323.9,288.8" fill="#3d3b37"/><text x="330" y="292" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">no</text><rect x="40" y="304" width="560" height="62" fill="none" stroke="#121314" stroke-width="1.5"/><text x="60" y="342" font-size="18" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">At least one trusted rating says clean?</text><line x1="600" y1="335" x2="680" y2="335" stroke="#121314" stroke-width="1.5"/><polygon points="680,335 670.8,338.9 670.8,331.1" fill="#121314"/><text x="640" y="326" font-size="12" fill="#3d3b37" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">yes</text><rect x="680" y="312" width="120" height="46" fill="#f1eee6" stroke="#1b7f5a" stroke-width="2"/><text x="740" y="342" font-size="18" fill="#1b7f5a" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="bold" font-style="normal" letter-spacing="2">PASS</text><text x="820" y="342" font-size="15" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">install proceeds, exit 0</text><line x1="320" y1="366" x2="320" y2="390" stroke="#3d3b37" stroke-width="1.5" stroke-dasharray="4 4"/><polygon points="320,390 316.1,380.8 323.9,380.8" fill="#3d3b37"/><text x="330" y="384" font-size="12" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">no</text><rect x="40" y="396" width="560" height="62" fill="none" stroke="#121314" stroke-width="1.5"/><text x="60" y="434" font-size="18" fill="#121314" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="normal" letter-spacing="0">No trusted evidence at all</text><line x1="600" y1="427" x2="680" y2="427" stroke="#121314" stroke-width="1.5"/><polygon points="680,427 670.8,430.9 670.8,423.1" fill="#121314"/><text x="640" y="418" font-size="12" fill="#3d3b37" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">then</text><rect x="680" y="404" width="120" height="46" fill="#f1eee6" stroke="#a86b00" stroke-width="2"/><text x="740" y="434" font-size="18" fill="#a86b00" text-anchor="middle" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="bold" font-style="normal" letter-spacing="2">WARN</text><text x="820" y="434" font-size="15" fill="#3d3b37" text-anchor="start" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-weight="normal" font-style="normal" letter-spacing="0">install asks first, exit 3</text><text x="40" y="504" font-size="15" fill="#3d3b37" text-anchor="start" font-family="Libre Caslon Text, Georgia, 'Times New Roman', serif" font-weight="normal" font-style="italic" letter-spacing="0">One honest trusted rater outweighs any number of sybil wallets: a single trusted malicious rating blocks.</text></svg>
